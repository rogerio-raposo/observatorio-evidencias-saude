name: OES Auth G2-P1 read-only — DISABLED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2-p1-readonly:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r applications/oes_web/requirements.txt
      - name: Connected read-only identity and schema verification
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_auth_pg_g2_trial_optin
          OES_AUTH_G2_EXPLICIT_OPT_IN: '1'
          OES_AUTH_G2_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_AUTH_G2_PASSWORD: ${{ secrets.OES_AUTH_G2_P1_PASSWORD }}
        run: |
          python - <<'PY'
          import django
          django.setup()
          from config.auth_pg_g2_p1_preflight import verify_g2_read_only
          print(verify_g2_read_only())
          PY
