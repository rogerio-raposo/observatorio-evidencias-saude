name: OES Django Auth B2-M1 migrations — DISABLED
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oes-django-auth-b2-m1
  cancel-in-progress: false
jobs:
  django-auth-migrations:
    if: ${{ false }}
    # Gate B2-M1 has NOT been approved. A separate, specific approval is mandatory.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -r applications/oes_web/requirements.txt
      - name: Gate-specific ephemeral credential is required
        env:
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_M1_PASSWORD }}
        run: |
          if [ -z "$OES_AUTH_B2_PASSWORD" ]; then
            echo "HOLD: separate B2-M1 credential missing" >&2
            exit 1
          fi
      - name: Mandatory Django connected preflight and planned migrations
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_auth_pg_b2_optin
          OES_AUTH_B2_EXPLICIT_OPT_IN: '1'
          OES_AUTH_B2_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_M1_PASSWORD }}
        run: |
          python - <<'PY'
          import django
          from django.core.management import call_command
          django.setup()
          from config.auth_pg_b2_scope import assert_approved_migration_scope
          print(assert_approved_migration_scope(), flush=True)
          from config.auth_pg_b2_preflight import read_only_preflight
          print(read_only_preflight()["status"], flush=True)
          from config.auth_pg_b2_inventory import write_baseline
          from pathlib import Path
          write_baseline(Path.cwd() / ".b2_m1_scientific_before.json")
          # Django migration recorder and post_migrate are scoped by the auth router.
          call_command("showmigrations", plan=True, database="default", verbosity=1)
          call_command("migrate", database="default", interactive=False, verbosity=1)
          print("MIGRATE_COMMAND_COMPLETED", flush=True)
          PY
      - name: Postflight inspection only — even if migration fails
        if: ${{ always() }}
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_auth_pg_b2_optin
          OES_AUTH_B2_EXPLICIT_OPT_IN: '1'
          OES_AUTH_B2_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_M1_PASSWORD }}
        run: |
          python - <<'PY'
          import django
          django.setup()
          from config.auth_pg_b2_postflight import postflight
          from pathlib import Path
          print(postflight(Path.cwd() / ".b2_m1_scientific_before.json"), flush=True)
          PY
