name: OES Django Auth B2-M1 migrations — DISABLED
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oes-django-auth-b2-m1
  cancel-in-progress: false
jobs:
  django-auth-migrations:
    # Gate B2-M1 has NOT been approved. A separate, specific approval is mandatory.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -r applications/oes_web/requirements.txt
      - name: Gate-specific ephemeral credential is required
        env:
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_M1_PASSWORD }}
        run: |
          if [ -z "$OES_AUTH_B2_PASSWORD" ]; then
            echo "HOLD: separate B2-M1 credential missing" >&2
            exit 1
          fi
      - name: Mandatory Django connected preflight and planned migrations
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_auth_pg_b2_optin
          OES_AUTH_B2_EXPLICIT_OPT_IN: '1'
          OES_AUTH_B2_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_M1_PASSWORD }}
        run: |
          python - <<'PY'
          import django
          from django.core.management import call_command
          django.setup()
          from config.auth_pg_b2_preflight import read_only_preflight
          print(read_only_preflight()["status"], flush=True)
          from config.auth_pg_b2_inventory import write_baseline
          from pathlib import Path
          write_baseline(Path.cwd() / ".b2_m1_scientific_before.json")
          # Django migration recorder and post_migrate are scoped by the auth router.
          call_command("showmigrations", plan=True, database="default", verbosity=1)
          call_command("migrate", database="default", interactive=False, verbosity=1)
          print("MIGRATE_COMMAND_COMPLETED", flush=True)
          PY
      - name: Postflight inspection only — even if migration fails
        if: ${{ always() }}
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_auth_pg_b2_optin
          OES_AUTH_B2_EXPLICIT_OPT_IN: '1'
          OES_AUTH_B2_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_M1_PASSWORD }}
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connections
          with connections["default"].cursor() as cursor:
              cursor.execute("""
                  SELECT current_user, current_schema(),
                         (SELECT count(*) FROM pg_catalog.pg_class
                          WHERE relnamespace='django_auth'::regnamespace)
              """)
              print("B2_M1_POSTFLIGHT_ROLE_SCHEMA_OBJECTS", cursor.fetchone())
              cursor.execute("""
                  SELECT to_regclass('django_auth.django_migrations') IS NOT NULL
              """)
              recorder_exists = cursor.fetchone()[0]
              print("B2_M1_MIGRATION_RECORDER_EXISTS", recorder_exists)
              if recorder_exists:
                  cursor.execute("""
                      SELECT app, name FROM django_auth.django_migrations
                      ORDER BY app, name
                  """)
                  migrations = cursor.fetchall()
                  print("B2_M1_APPLIED_MIGRATIONS", migrations, flush=True)
                  expected_apps = {"auth", "contenttypes", "sessions", "preparer_identity"}
                  recorded_apps = {app for app, _ in migrations}
                  if recorded_apps != expected_apps:
                      raise RuntimeError("HOLD: unexpected or incomplete migration app set")
                  cursor.execute("""
                      SELECT app_label, model, count(*) FROM django_auth.django_content_type
                      WHERE app_label IN ('auth','contenttypes','sessions',
                                          'preparer_identity','evidence')
                      GROUP BY app_label, model ORDER BY app_label, model
                  """)
                  print("B2_M1_CONTENT_TYPE_METADATA", cursor.fetchall(), flush=True)
                  cursor.execute("""
                      SELECT ct.app_label, count(*) FROM django_auth.auth_permission AS p
                      JOIN django_auth.django_content_type AS ct ON ct.id=p.content_type_id
                      GROUP BY ct.app_label ORDER BY ct.app_label
                  """)
                  print("B2_M1_PERMISSION_COUNTS", cursor.fetchall(), flush=True)
              else:
                  raise RuntimeError("HOLD: migration recorder absent")

          from config.auth_pg_b2_inventory import compare_baseline
          from pathlib import Path
          compare_baseline(Path.cwd() / ".b2_m1_scientific_before.json")
          PY
