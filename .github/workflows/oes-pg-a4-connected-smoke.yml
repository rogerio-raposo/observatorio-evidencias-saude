name: OES PG-A4 synthetic Django connected smoke - manual
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oes-pg-a4-connected-smoke
  cancel-in-progress: false

jobs:
  reader-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main' && github.repository == 'rogerio-raposo/observatorio-evidencias-saude'
    env:
      OES_PG_A4_ENABLED: '1'
      OES_PG_A4_EXPECTED_MODE: relational
      OES_PG_A4_HOST: ep-wispy-dream-b6021bw0-pooler.c-2.sa-east-1.aws.neon.tech
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django and PostgreSQL driver
        working-directory: applications/oes_web
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight Django configuration without secret or network
        working-directory: applications/oes_web
        env:
          OES_PG_A4_PASSWORD: preflight-placeholder-not-a-real-credential
        shell: bash
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connections
          from evidence.synthetic_pg_reader import ALIAS
          from django.conf import settings
          assert settings.DATABASES["default"]["ENGINE"] == "django.db.backends.dummy"
          conf = connections[ALIAS].settings_dict
          assert conf["ENGINE"] == "django.db.backends.postgresql"
          assert conf["NAME"] == "oes_sandbox"
          assert conf["USER"] == "oes_pg_a4_reader"
          assert conf["OPTIONS"]["sslmode"] == "require"
          assert conf["OPTIONS"]["options"] == "-c default_transaction_read_only=on"
          print("PASS PG_A4_DJANGO_CONFIG_PREFLIGHT_NO_CONNECTION")
          PY
      - name: Require temporary password secret
        env:
          OES_PG_A4_PASSWORD: ${{ secrets.OES_PG_A4_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$OES_PG_A4_PASSWORD" ]; then
            echo "::error::Missing temporary OES_PG_A4_PASSWORD secret"
            exit 1
          fi
      - name: Execute one read-only connected Django smoke test
        env:
          OES_PG_A4_PASSWORD: ${{ secrets.OES_PG_A4_PASSWORD }}
        working-directory: applications/oes_web
        run: python scripts/check_pg_a4_connected.py
