name: OES M2-A6 historical link checks
on:
  push:
    paths:
      - 'tests/test_m2_a6_historical_links.py'
      - 'database/f3-real-case-01-dcbti.sql'
      - '.github/workflows/oes-m2-a6-link-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immutable historical links and fail-closed mutations
        run: python -m unittest discover -s tests -p test_m2_a6_historical_links.py -v
