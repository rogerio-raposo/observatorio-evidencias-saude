name: F4 PG18 migrations 031-036 fault snapshots (synthetic-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f4-pg18-031-036-fault-rehearsal.yml'
      - 'scripts/oes_f4_pg18_031_036_fault_rehearsal.py'
      - 'database/f4-neon-sandbox-schema-migration-manifest.txt'

permissions:
  contents: read

jobs:
  pg18-disposable-fault-model:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: oes_f4_fault_synthetic
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d oes_f4_fault_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: oes_f4_fault_synthetic
      PGCONNECT_TIMEOUT: '5'
    steps:
      - name: Checkout fixed commit without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify PG18 database and script syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p f4-pg18-fault-evidence
          python -m py_compile scripts/oes_f4_pg18_031_036_fault_rehearsal.py
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version | tee f4-pg18-fault-evidence/client-version.txt
          psql -X -v ON_ERROR_STOP=1 -Atc 'SHOW server_version;' | tee f4-pg18-fault-evidence/server-version.txt
          grep -q '^18' f4-pg18-fault-evidence/server-version.txt
      - name: Run 031-036 with catalog snapshots and injected fault states
        shell: bash
        run: |
          set -euo pipefail
          python scripts/oes_f4_pg18_031_036_fault_rehearsal.py 2>&1 | tee f4-pg18-fault-evidence/harness.log
          grep -Fxq PG18_031_036_FAULT_OBSERVATIONS_ONLY f4-pg18-fault-evidence/result.txt
      - name: Upload evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-pg18-031-036-fault-observations
          path: f4-pg18-fault-evidence/
          if-no-files-found: warn
