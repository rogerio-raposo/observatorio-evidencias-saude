name: OES Q0 synthetic auth - READ ONLY attestation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oes-q0-auth-readonly-attestation
  cancel-in-progress: false
jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout dispatched source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: applications/oes_web/requirements.txt
      - name: Install dependencies
        working-directory: applications/oes_web
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run auth-only read-only attestation
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_q0_auth_attestation
          OES_AUTH_ATTEST_ONLY: '1'
          OES_Q0_AUTH_PASSWORD: ${{ secrets.OES_Q0_AUTH_PASSWORD }}
        run: python -m scripts.attest_synthetic_q0_auth_readonly
