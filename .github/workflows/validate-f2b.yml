name: OES F2-B PostgreSQL PoC

on:
  workflow_dispatch:
  push:
    paths:
      - 'database/**'
      - '.github/workflows/validate-f2b.yml'

permissions:
  contents: read

jobs:
  postgres-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oes_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oes_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: oes_poc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p f2b-artifacts

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version | tee f2b-artifacts/psql-client-version.txt

      - name: Capture PostgreSQL server version and SQL hashes
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "SELECT version();" | tee f2b-artifacts/postgresql-server-version.txt
          sha256sum             database/poc-s1.sql             database/002_poc_s2_search_screening_risk.sql             database/003_poc_s3_provenance_guard.sql             database/poc-s1-smoke.sql             database/f2b-fixtures.sql             database/f2b-tests.sql             database/f2b-rebuild-check.sql             | tee f2b-artifacts/sql-sha256.txt

      - name: T01 — clean install baseline and migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/poc-s1.sql 2>&1 | tee f2b-artifacts/T01-baseline.log
          psql -v ON_ERROR_STOP=1 -f database/002_poc_s2_search_screening_risk.sql 2>&1 | tee f2b-artifacts/T01-migration-002.log
          psql -v ON_ERROR_STOP=1 -f database/003_poc_s3_provenance_guard.sql 2>&1 | tee f2b-artifacts/T01-migration-003.log

      - name: T02 — PoC-S1 smoke test
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/poc-s1-smoke.sql 2>&1 | tee f2b-artifacts/T02-smoke.log

      - name: Verify installed objects
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL' 2>&1 | tee f2b-artifacts/object-counts.log
          DO $verify$
          DECLARE
            table_count integer;
            view_count integer;
          BEGIN
            SELECT count(*)
              INTO table_count
              FROM information_schema.tables
             WHERE table_schema IN (
               'core','investigation','evidence','synthesis',
               'appraisal','product','provenance','artifact'
             )
               AND table_type = 'BASE TABLE';

            IF table_count <> 39 THEN
              RAISE EXCEPTION
                'Expected 39 OES tables after S1+S2, found %',
                table_count;
            END IF;

            SELECT count(*)
              INTO view_count
              FROM information_schema.views
             WHERE table_schema IN (
               'core','evidence','synthesis','appraisal','product'
             );

            IF view_count <> 5 THEN
              RAISE EXCEPTION
                'Expected 5 OES views, found %',
                view_count;
            END IF;

            RAISE NOTICE 'Object counts PASS — tables %, views %', table_count, view_count;
          END
          $verify$;
          SQL

      - name: Load deterministic F2-B fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f2b-fixtures.sql 2>&1 | tee f2b-artifacts/fixtures.log

      - name: T03–T13 and T16–T19 — runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f2b-tests.sql 2>&1 | tee f2b-artifacts/T03-T19-runtime.log

      - name: T15 — migration double-apply must fail cleanly
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -v ON_ERROR_STOP=1 -f database/002_poc_s2_search_screening_risk.sql             > f2b-artifacts/T15-double-apply.log 2>&1
          rc=$?
          set -e
          cat f2b-artifacts/T15-double-apply.log
          if [ "$rc" -eq 0 ]; then
            echo "T15 FAIL — migration 002 was applied twice without detection" | tee -a f2b-artifacts/T15-double-apply.log
            exit 1
          fi
          echo "T15 PASS — accidental second application failed in a controlled, detectable way" | tee -a f2b-artifacts/T15-double-apply.log

      - name: T14 — rebuild from zero
        shell: bash
        run: |
          set -euo pipefail
          createdb oes_rebuild
          {
            echo "=== baseline ==="
            PGDATABASE=oes_rebuild psql -v ON_ERROR_STOP=1 -f database/poc-s1.sql
            echo "=== migration 002 ==="
            PGDATABASE=oes_rebuild psql -v ON_ERROR_STOP=1 -f database/002_poc_s2_search_screening_risk.sql
            echo "=== migration 003 ==="
            PGDATABASE=oes_rebuild psql -v ON_ERROR_STOP=1 -f database/003_poc_s3_provenance_guard.sql
            echo "=== fixtures ==="
            PGDATABASE=oes_rebuild psql -v ON_ERROR_STOP=1 -f database/f2b-fixtures.sql
            echo "=== rebuild assertions ==="
            PGDATABASE=oes_rebuild psql -v ON_ERROR_STOP=1 -f database/f2b-rebuild-check.sql
          } 2>&1 | tee f2b-artifacts/T14-rebuild.log

      - name: Final F2-B status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "GATE F2-B runtime suite PASS"
            echo "T01 PASS — clean install"
            echo "T02 PASS — smoke"
            echo "T03–T13 PASS — integrity/versioning/provenance/lineage/rollback"
            echo "T14 PASS — rebuild from zero"
            echo "T15 PASS — migration double-apply detected"
            echo "T16–T19 PASS — screening/risk/dedup/end-to-end chain"
            echo "PostgreSQL service: postgres:18"
            echo "Candidate remains experimental pending formal gate record."
          } | tee f2b-artifacts/F2B-summary.txt

      - name: Upload F2-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oes-f2b-evidence-${{ github.run_id }}
          path: f2b-artifacts/
          if-no-files-found: warn
          retention-days: 30
