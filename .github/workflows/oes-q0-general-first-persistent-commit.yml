name: OES Q0 general first persistent commit - reserved operation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'REVIEW_ONLY by default; connected modes require separate nominal operational approval'
        required: true
        default: REVIEW_ONLY
        type: choice
        options:
          - REVIEW_ONLY
          - FIRST_CANONICAL_Q0_COMMIT
          - RECONCILE_FIRST_Q0_READ_ONLY
      approved_sha:
        description: 'Full reviewed main SHA; identities, request and question are reserved in source'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Serialization is not atomic consumption of operational authorization.
concurrency:
  group: oes-q0-general-first-persistent-commit
  cancel-in-progress: false

env:
  OES_Q0_FIRST_MODE: ${{ inputs.mode }}
  OES_Q0_FIRST_REQUESTED_SHA: ${{ inputs.approved_sha }}
  OES_Q0_FIRST_APPROVED_SHA: ${{ vars.OES_Q0_FIRST_APPROVED_SHA }}
  OES_Q0_FIRST_AUTHORIZATION: ${{ vars.OES_Q0_FIRST_AUTHORIZATION }}

jobs:
  review-only:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'rogerio-raposo/observatorio-evidencias-saude' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review fixed manifest and SHA without Django or database credentials
        working-directory: applications/oes_web
        run: python -m scripts.q0_general_first_commit --review-workflow

  first-commit:
    needs: review-only
    # Durable consumption waived only for the supervised fixed experiment.
    # Administrative supervision, NOT a technical one-use guarantee.
    # Supervisor must revoke temporary approval variables after the attempt.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'rogerio-raposo/observatorio-evidencias-saude' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.mode == 'FIRST_CANONICAL_Q0_COMMIT' && inputs.approved_sha == github.sha && vars.OES_Q0_FIRST_APPROVED_SHA == github.sha && vars.OES_Q0_FIRST_AUTHORIZATION == format('APPROVED_FIRST_CANONICAL_Q0_COMMIT:{0}:q0-general-first-6bf4279cc0844fda9ad4d07f5656fb0a', github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck actual checkout and nominal first-commit approval
        working-directory: applications/oes_web
        run: python -m scripts.q0_general_first_commit --review-workflow
      - name: Install existing requirements without database credentials
        run: python -m pip install --disable-pip-version-check -r applications/oes_web/requirements.txt
      - name: Reserved canonical call - restricted CLI and canonical construction
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          OES_PG_A4_ENABLED: '1'
          OES_Q0_MULTI_ALIAS_ENABLED: '1'
          OES_PG_A4_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_Q0_AUTH_PASSWORD: ${{ secrets.OES_Q0_AUTH_PASSWORD }}
          OES_Q0_WRITER_PASSWORD: ${{ secrets.OES_Q0_WRITER_PASSWORD }}
          OES_PG_A4_PASSWORD: ${{ secrets.OES_PG_A4_READER_PASSWORD }}
        run: python -m scripts.q0_general_first_commit

  independent-reconciliation:
    needs: review-only
    # Separately reviewable reader path; never depends on first-commit or a writer secret.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'rogerio-raposo/observatorio-evidencias-saude' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.mode == 'RECONCILE_FIRST_Q0_READ_ONLY' && inputs.approved_sha == github.sha && vars.OES_Q0_FIRST_APPROVED_SHA == github.sha && vars.OES_Q0_FIRST_AUTHORIZATION == format('APPROVED_FIRST_Q0_READ_ONLY_RECONCILIATION:{0}:q0-general-first-6bf4279cc0844fda9ad4d07f5656fb0a', github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck actual checkout and distinct READ ONLY approval
        working-directory: applications/oes_web
        run: python -m scripts.q0_general_first_commit --review-workflow
      - name: Install existing requirements without database credentials
        run: python -m pip install --disable-pip-version-check -r applications/oes_web/requirements.txt
      - name: Reserved independent reader - independently authorized READ ONLY recovery
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          OES_Q0_RECOVERY_READONLY_ENABLED: '1'
          OES_PG_A4_ENABLED: '1'
          OES_PG_A4_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_Q0_AUTH_PASSWORD: ${{ secrets.OES_Q0_AUTH_PASSWORD }}
          OES_PG_A4_PASSWORD: ${{ secrets.OES_PG_A4_READER_PASSWORD }}
        run: python -m scripts.q0_general_first_commit
