permissions:
  contents: read

jobs:
  postgres-s5:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oes_s5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oes_s5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: oes_s5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare evidence directory
        run: mkdir -p s5-artifacts

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version | tee s5-artifacts/psql-client-version.txt

      - name: Capture environment and SQL hashes
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "SELECT version();" | tee s5-artifacts/postgresql-server-version.txt
