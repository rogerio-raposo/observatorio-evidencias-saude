permissions:
  contents: read

jobs:
  postgres-s5:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oes_s5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oes_s5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: oes_s5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare evidence directory
        run: mkdir -p s5-artifacts

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version | tee s5-artifacts/psql-client-version.txt

      - name: Capture environment and SQL hashes
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "SELECT version();" | tee s5-artifacts/postgresql-server-version.txt
          sha256sum             database/poc-s1.sql             database/002_poc_s2_search_screening_risk.sql             database/003_poc_s3_provenance_guard.sql             database/004_poc_s4_report_relation_impact.sql             database/005_poc_s5_specialized_methods.sql             database/006_product_evidence_sheet_contract.sql             database/007_evidence_sheet_view.sql             database/008_evidence_sheet_provenance_references.sql             database/009_evidence_sheet_view_evidence_counts.sql             database/010_product_assurance_governance.sql             database/011_evidence_sheet_assurance_view.sql             database/012_evidence_response_contract.sql             database/013_evidence_scan_contract.sql             database/014_rapid_evidence_synthesis_contract.sql             database/015_evidence_review_contract.sql             database/016_evidence_map_contract.sql             database/017_evidence_map_view_rendering_readiness.sql             database/018_evidence_map_source_corpus_support.sql             database/f3-evidence-map-source-corpus-tests.sql             database/f3-real-case-map01-ambient-ai-scribes.sql             database/f3-real-case-map01-tests.sql             database/f3-real-case-map01-assurance-a1.sql             database/f3-real-case-map01-a1-tests.sql             database/f3-evidence-map-fixtures.sql             database/f3-evidence-map-view-tests.sql             database/f3-evidence-map-view-rebuild-check.sql             database/f3-evidence-map-tests-a.sql             database/f3-evidence-map-tests-b.sql             database/f3-evidence-map-rebuild-check.sql             database/f3-evidence-review-fixtures.sql             database/f3-evidence-review-tests-a.sql             database/f3-evidence-review-tests-b.sql             database/f3-evidence-review-rebuild-check.sql             database/f3-rapid-evidence-synthesis-fixtures.sql             database/f3-rapid-evidence-synthesis-tests.sql             database/f3-rapid-evidence-synthesis-rebuild-check.sql             database/f3-real-case-n3-ambient-ai-scribes.sql             database/f3-real-case-n3-tests-a.sql             database/f3-real-case-n3-tests-b.sql             database/f3-real-case-n3-rebuild-check.sql             database/f3-real-case-n3-revision-01.sql             database/f3-real-case-n3-revision-01-tests.sql             database/f3-real-case-n3-revision-01-rebuild-check.sql             database/f3-real-case-n3-adversarial-02-revise.sql             database/f3-real-case-n3-adversarial-02-tests.sql             database/f3-real-case-n3-adversarial-02-rebuild-check.sql             database/f3-evidence-scan-fixtures.sql             database/f3-evidence-scan-tests.sql             database/f3-evidence-scan-rebuild-check.sql             database/f3-real-case-n0-genai-mental-health.sql             database/f3-real-case-n0-tests.sql             database/f3-real-case-n0-rebuild-check.sql             database/f3-real-case-n0-ai-verification.sql             database/f3-real-case-n0-a1-tests.sql             database/f3-real-case-n0-a1-rebuild-check.sql             database/f3-evidence-response-fixtures.sql             database/f3-evidence-response-tests.sql             database/f3-evidence-response-rebuild-check.sql             database/f3-provenance-reference-tests.sql             database/f3-provenance-reference-rebuild-check.sql             database/f3-real-case-01-dcbti.sql             database/f3-real-case-01-tests.sql             database/f3-real-case-01-rebuild-check.sql             database/f3-assurance-gate-tests.sql             database/f3-assurance-view-tests.sql             database/f2b-fixtures.sql             database/s4-fixtures.sql             database/s5-fixtures.sql             database/f2b-tests.sql             database/s4-tests.sql             database/s5-tests.sql             database/s5-rebuild-check.sql             database/f3-evidence-sheet-fixtures.sql             database/f3-evidence-sheet-tests.sql             database/f3-evidence-sheet-rebuild-check.sql             database/f3-evidence-sheet-view-tests.sql             database/f3-evidence-sheet-view-rebuild-check.sql             templates/evidence-sheet.md             templates/evidence-sheet-presentation-map.json             scripts/render_evidence_sheet_reference.py             scripts/validate_evidence_sheet_render.py             templates/evidence-response.md             templates/evidence-response-presentation-map.json             scripts/render_evidence_response_reference.py             scripts/validate_evidence_response_render.py             templates/evidence-scan.md             templates/evidence-scan-presentation-map.json             scripts/render_evidence_scan_reference.py             scripts/validate_evidence_scan_render.py             templates/rapid-evidence-synthesis.md             templates/rapid-evidence-synthesis-presentation-map.json             scripts/render_rapid_evidence_synthesis_reference.py             scripts/validate_rapid_evidence_synthesis_render.py             scripts/validate_real_n3_render.py             templates/evidence-review.md             templates/evidence-review-presentation-map.json             scripts/render_evidence_review_reference.py             scripts/validate_evidence_review_render.py             templates/evidence-map.md             templates/evidence-map-presentation-map.json             scripts/render_evidence_map_reference.py             scripts/validate_evidence_map_render.py             scripts/validate_real_map01_render.py             templates/ai-methodological-verification.md             templates/owner-governance-approval.md             | tee s5-artifacts/sql-sha256.txt

      - name: Install baseline through migration 019
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/poc-s1.sql 2>&1 | tee s5-artifacts/S5-T01-baseline.log
          psql -v ON_ERROR_STOP=1 -f database/002_poc_s2_search_screening_risk.sql 2>&1 | tee s5-artifacts/S5-T01-002.log
          psql -v ON_ERROR_STOP=1 -f database/003_poc_s3_provenance_guard.sql 2>&1 | tee s5-artifacts/S5-T01-003.log
          psql -v ON_ERROR_STOP=1 -f database/004_poc_s4_report_relation_impact.sql 2>&1 | tee s5-artifacts/S5-T01-004.log
          psql -v ON_ERROR_STOP=1 -f database/005_poc_s5_specialized_methods.sql 2>&1 | tee s5-artifacts/S5-T01-005.log
          psql -v ON_ERROR_STOP=1 -f database/006_product_evidence_sheet_contract.sql 2>&1 | tee s5-artifacts/F3-FE-T01-006.log
          psql -v ON_ERROR_STOP=1 -f database/007_evidence_sheet_view.sql 2>&1 | tee s5-artifacts/F3-VIEW-T01-007.log
          psql -v ON_ERROR_STOP=1 -f database/008_evidence_sheet_provenance_references.sql 2>&1 | tee s5-artifacts/F3-PROV-008.log
          psql -v ON_ERROR_STOP=1 -f database/009_evidence_sheet_view_evidence_counts.sql 2>&1 | tee s5-artifacts/F3-VIEW-T17-009.log
          psql -v ON_ERROR_STOP=1 -f database/010_product_assurance_governance.sql 2>&1 | tee s5-artifacts/F3-ASSURANCE-010.log
          psql -v ON_ERROR_STOP=1 -f database/011_evidence_sheet_assurance_view.sql 2>&1 | tee s5-artifacts/F3-ASSURANCE-VIEW-011.log
          psql -v ON_ERROR_STOP=1 -f database/012_evidence_response_contract.sql 2>&1 | tee s5-artifacts/F3-ER-012.log
          psql -v ON_ERROR_STOP=1 -f database/013_evidence_scan_contract.sql 2>&1 | tee s5-artifacts/F3-ES-013.log
          psql -v ON_ERROR_STOP=1 -f database/014_rapid_evidence_synthesis_contract.sql 2>&1 | tee s5-artifacts/F3-RS-014.log
          psql -v ON_ERROR_STOP=1 -f database/015_evidence_review_contract.sql 2>&1 | tee s5-artifacts/F3-ER4-015.log
          psql -v ON_ERROR_STOP=1 -f database/016_evidence_map_contract.sql 2>&1 | tee s5-artifacts/F3-MAP-016.log
          psql -v ON_ERROR_STOP=1 -f database/017_evidence_map_view_rendering_readiness.sql 2>&1 | tee s5-artifacts/F3-MAP-VIEW-017.log
          psql -v ON_ERROR_STOP=1 -f database/018_evidence_map_source_corpus_support.sql 2>&1 | tee s5-artifacts/F3-MAP-SOURCE-018.log
          psql -v ON_ERROR_STOP=1 -f database/019_overview_of_reviews_contract.sql 2>&1 | tee s5-artifacts/F3-OVERVIEW-019.log

      - name: Load F2-B fixtures and run regression
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f2b-fixtures.sql 2>&1 | tee s5-artifacts/base-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f2b-tests.sql 2>&1 | tee s5-artifacts/regression-f2b.log

      - name: Load S4 fixtures and run regression
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/s4-fixtures.sql 2>&1 | tee s5-artifacts/s4-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/s4-tests.sql 2>&1 | tee s5-artifacts/regression-s4.log

      - name: Load S5 fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/s5-fixtures.sql 2>&1 | tee s5-artifacts/s5-fixtures.log

      - name: S5-T02–T15 — specialized runtime tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/s5-tests.sql 2>&1 | tee s5-artifacts/S5-T02-T15.log

      - name: Load Evidence Sheet fixture and run F3 contract tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-sheet-fixtures.sql 2>&1 | tee s5-artifacts/f3-fe-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-sheet-tests.sql 2>&1 | tee s5-artifacts/f3-fe-tests.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-sheet-view-tests.sql 2>&1 | tee s5-artifacts/f3-view-tests.log
          psql -v ON_ERROR_STOP=1 -f database/f3-assurance-gate-tests.sql 2>&1 | tee s5-artifacts/f3-assurance-gate-tests.log

      - name: Evidence Response N1 — load fixture and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-response-fixtures.sql 2>&1 | tee s5-artifacts/f3-er-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-response-tests.sql 2>&1 | tee s5-artifacts/f3-er-tests.log
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT product.evidence_response_view('91000000-0000-0000-0000-000000000301')::text;" > s5-artifacts/evidence-response-view.json
          echo "F3-ER-T01–T13 PASS — N1 contract validated without mandatory Synthesis/Certainty" | tee -a s5-artifacts/f3-er-tests.log

      - name: Evidence Scan N0 — load fixture and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-scan-fixtures.sql 2>&1 | tee s5-artifacts/f3-es-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-scan-tests.sql 2>&1 | tee s5-artifacts/f3-es-tests.log
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT product.evidence_scan_view('b1000000-0000-0000-0000-000000000301')::text;" > s5-artifacts/evidence-scan-view.json
          echo "ES-T01–T14 PASS — N0 contract validated without mandatory Synthesis/Certainty/RiskAssessment" | tee -a s5-artifacts/f3-es-tests.log

      - name: Rapid Evidence Synthesis N3 — load fixture and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-rapid-evidence-synthesis-fixtures.sql 2>&1 | tee s5-artifacts/f3-rs-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f3-rapid-evidence-synthesis-tests.sql 2>&1 | tee s5-artifacts/f3-rs-tests.log
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT product.rapid_evidence_synthesis_view('d1000000-0000-0000-0000-000000000601')::text;" > s5-artifacts/rapid-evidence-synthesis-view.json
          echo "RS-T01–T14 PASS — N3 scientific core validated; human-control/A3 gate remains closed by design" | tee -a s5-artifacts/f3-rs-tests.log

      - name: Evidence Review N4 — load formal synthetic fixture and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-review-fixtures.sql 2>&1 | tee s5-artifacts/f3-er4-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-review-tests-a.sql 2>&1 | tee s5-artifacts/f3-er4-tests-a.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-review-tests-b.sql 2>&1 | tee s5-artifacts/f3-er4-tests-b.log
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT product.evidence_review_view('f1000000-0000-0000-0000-000000000701')::text;" > s5-artifacts/evidence-review-view.json
          echo "ER4-T01–T25 PASS — formal synthetic N4 validates A3 plus qualified stage controls" | tee -a s5-artifacts/f3-er4-tests-b.log

      - name: Evidence Map — load formal synthetic fixture and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-map-fixtures.sql 2>&1 | tee s5-artifacts/f3-map-fixtures.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-map-tests-a.sql 2>&1 | tee s5-artifacts/f3-map-tests-a.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-map-tests-b.sql 2>&1 | tee s5-artifacts/f3-map-tests-b.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-map-view-tests.sql 2>&1 | tee s5-artifacts/f3-map-view-tests.log
          psql -v ON_ERROR_STOP=1 -f database/f3-evidence-map-source-corpus-tests.sql 2>&1 | tee s5-artifacts/f3-map-source-corpus-tests.log
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT product.evidence_map_view('b4100000-0000-0000-0000-000000000020')::text;" > s5-artifacts/evidence-map-view.json
          echo "EM-T01–T19 + EMV-T01–T09 PASS — Evidence Map contract and rendering-readiness projection validated" | tee -a s5-artifacts/f3-map-view-tests.log

      - name: Real N3-01 — ambient AI scribes experimental A0 and corrected v2
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-ambient-ai-scribes.sql 2>&1 | tee s5-artifacts/rn3-load.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-tests-a.sql 2>&1 | tee s5-artifacts/rn3-tests-a.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-tests-b.sql 2>&1 | tee s5-artifacts/rn3-tests-b.log
          echo "RN3-T01–T15 PASS — real N3 v1 scientific core complete; A0 blockers preserved" | tee -a s5-artifacts/rn3-tests-b.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-revision-01.sql 2>&1 | tee s5-artifacts/rn3-revision-01-load.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-revision-01-tests.sql 2>&1 | tee s5-artifacts/rn3-revision-01-tests.log
          echo "RN3-R1-T01–T09 PASS — corrected ProductVersion 2 preserves effect/GRADE core and expands coverage" | tee -a s5-artifacts/rn3-revision-01-tests.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-adversarial-02-revise.sql 2>&1 | tee s5-artifacts/rn3-adversarial-02-load.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-n3-adversarial-02-tests.sql 2>&1 | tee s5-artifacts/rn3-adversarial-02-tests.log
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT product.rapid_evidence_synthesis_view('e1000000-0000-0000-0000-000000000702')::text;" > s5-artifacts/real-n3-01-view.json
          echo "RN3-ADV2-T01–T05 PASS — second REVISE preserves A0 and formal N3 blockers" | tee -a s5-artifacts/rn3-adversarial-02-tests.log

      - name: MAP-01 — real exploratory Evidence Map A0 to A1
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-map01-ambient-ai-scribes.sql 2>&1 | tee s5-artifacts/map01-load-a0.log
          psql -v ON_ERROR_STOP=1 -f database/f3-real-case-map01-tests.sql 2>&1 | tee s5-artifacts/map01-tests-a0.log
