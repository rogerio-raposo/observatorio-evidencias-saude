name: F4 PostgreSQL 18 grandfathering 032 synthetic-only (no Neon)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f4-pg18-032-grandfather-synthetic.yml'
      - 'scripts/oes_f4_pg18_032_grandfather_test.py'
      - 'tests/fixtures/f4-grandfathering-032/**'
      - 'database/f4-neon-sandbox-schema-migration-manifest.txt'

permissions:
  contents: read

jobs:
  synthetic-grandfather-032:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: oes_f4_032_synthetic
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d oes_f4_032_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: oes_f4_032_synthetic
      PGCONNECT_TIMEOUT: '5'
    steps:
      - name: Checkout immutable CI commit, without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Python syntax and disposable PG18 server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p f4-pg18-032-evidence
          python3 -m py_compile scripts/oes_f4_pg18_032_grandfather_test.py
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version | tee f4-pg18-032-evidence/psql-version.txt
          psql -X -v ON_ERROR_STOP=1 -Atc 'SHOW server_version;' | tee f4-pg18-032-evidence/server-version.txt
          grep -q '^18' f4-pg18-032-evidence/server-version.txt
      - name: Validate grandfathering under constraint-consistent synthetic rows
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/oes_f4_pg18_032_grandfather_test.py 2>&1 | tee f4-pg18-032-evidence/harness.log
          grep -Fxq SYNTHETIC_032_GRANDFATHERING_PASS_LIMITED f4-pg18-032-evidence/result.txt
      - name: Preserve logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-pg18-032-grandfather-synthetic
          path: f4-pg18-032-evidence/
          if-no-files-found: warn
