name: OES E6-A3 synthetic artifact transport verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and preflight synthetic evidence (no HTTP)
        working-directory: tools/d2_e5_preservation
        run: python e6_synthetic_artifact.py
      - name: Upload seven-day synthetic artifact
        uses: actions/upload-artifact@v4
        with:
          name: oes-e6-a3-synthetic-${{ github.run_id }}
          path: tools/d2_e5_preservation/synthetic-artifact/
          retention-days: 7
          if-no-files-found: error
