name: OES Django vertical slice - manual test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-read-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: applications/oes_web/requirements.txt

      - name: Install Django dependency
        working-directory: applications/oes_web
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Q0 manual runner and transaction recipe without execution
        working-directory: applications/oes_web
        run: python -m py_compile scripts/run_q0_rollback_once.py evidence/question_orm_q0_connected_recipe_dormant.py

      - name: Check Django application configuration
        working-directory: applications/oes_web
        run: python manage.py check

      - name: Execute existing Django tests (no database)
        working-directory: applications/oes_web
        run: python manage.py test evidence.tests evidence.test_question_sql_port_offline evidence.test_question_sql_atomicity_offline evidence.test_question_sql_q1_atomicity_offline evidence.test_question_sql_replay_integration_offline evidence.test_question_orm_mapping_offline evidence.test_question_orm_transaction_offline evidence.test_question_orm_dml_compilation_offline evidence.test_question_orm_atomic_boundary_offline evidence.test_question_orm_q0_dormant evidence.test_question_orm_q0_repository_dormant evidence.test_question_orm_q0_rollback_plan_offline evidence.test_question_orm_q0_connected_recipe_dormant evidence.test_q0_multi_alias_settings_offline evidence.tests.test_pf_i03_q0_offline evidence.tests.test_pf_i03_q1_offline evidence.tests.test_pf_i03_q2_routing_offline evidence.tests.test_pf_i03_composed_offline --verbosity 2
