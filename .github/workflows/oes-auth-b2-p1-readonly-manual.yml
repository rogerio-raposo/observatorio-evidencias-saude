name: OES Django Auth B2-P1 single read-only preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  django-auth-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r applications/oes_web/requirements.txt
      - name: Read-only Django connection check (manually gated)
        working-directory: applications/oes_web
        env:
          DJANGO_SETTINGS_MODULE: config.settings_auth_pg_b2_optin
          OES_AUTH_B2_EXPLICIT_OPT_IN: '1'
          OES_AUTH_B2_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
          OES_AUTH_B2_PASSWORD: ${{ secrets.OES_AUTH_B2_PASSWORD }}
        run: |
          python - <<'PY'
          import django
          django.setup()
          from config.auth_pg_b2_preflight import read_only_preflight
          print(read_only_preflight()["status"])
          PY
