name: OES N1-E3 direct TLS read-only probe (synthetic-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oes-n1-e3-manual-probe
  cancel-in-progress: false

jobs:
  n1e3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OES_N1E3_DB_HOST: ${{ secrets.OES_N1E3_DB_HOST }}
      OES_N1E3_DB_PASSWORD: ${{ secrets.OES_N1E3_DB_PASSWORD }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check secret presence without disclosure
        shell: bash
        run: |
          if [[ -z "$OES_N1E3_DB_HOST" || -z "$OES_N1E3_DB_PASSWORD" ]]; then
            echo "N1-E3 BLOCKED: required secrets not configured"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated database client
        shell: bash
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate restricted identity and verified TLS (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg

          host = os.environ["OES_N1E3_DB_HOST"].strip()
          password = os.environ["OES_N1E3_DB_PASSWORD"]
          ca_bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not os.path.isfile(ca_bundle) or os.path.getsize(ca_bundle) == 0:
              raise SystemExit("N1-E3 BLOCKED: trusted CA bundle unavailable")
          if not host.endswith(".neon.tech") or host.startswith(".") or "/" in host or ":" in host or "-pooler" in host:
              raise SystemExit("N1-E3 BLOCKED: invalid or pooled Neon host")
          phase = "connection"
          try:
              with psycopg.connect(
                  host=host, port=5432, dbname="oes_t2a2_synthetic",
                  user="oes_t2a2_app", password=password,
                  sslmode="verify-full", sslrootcert=ca_bundle,
                  connect_timeout=10,
                  options="-c default_transaction_read_only=on",
              ) as conn:
                  phase = "query"
                  with conn.cursor() as cur:
                      cur.execute("""
                          SELECT current_database(), current_user,
                                 s.ssl, s.version, s.cipher
                          FROM pg_stat_ssl s
                          WHERE s.pid = pg_backend_pid()
                      """)
                      result = cur.fetchone()
              phase = "postcondition"
              if not result:
                  raise SystemExit("N1-E3 FAIL: SQL_NO_RESULT")
              if result[0] != "oes_t2a2_synthetic":
                  raise SystemExit("N1-E3 FAIL: DATABASE_MISMATCH")
              if result[1] != "oes_t2a2_app":
                  raise SystemExit("N1-E3 FAIL: ROLE_MISMATCH")
              # The client connection above requires a trusted CA and hostname
              # verification; pg_stat_ssl describes the backend-facing session.
              backend_ssl = result[2]
              backend_state = ("SSL_TRUE" if backend_ssl is True else
                               "SSL_FALSE" if backend_ssl is False else "UNOBSERVED")
              print("N1-E3 CLIENT_TLS_VERIFIED")
              print("N1-E3 BACKEND_TLS_OBSERVATION:", backend_state)
              print("N1-E3 BACKEND_VERSION_PRESENT:", bool(result[3]))
              print("N1-E3 BACKEND_CIPHER_PRESENT:", bool(result[4]))
          except psycopg.Error as exc:
              # Categorize locally, never print the underlying exception or connection string.
              state = exc.sqlstate or ""
              if state in ("28P01", "28000"):
                  category = "AUTH_REJECTED"
              elif state == "42501":
                  category = "SQL_PERMISSION"
              elif phase == "query":
                  category = "SQL_UNCLASSIFIED"
              else:
                  detail = str(exc).lower()
                  if any(t in detail for t in ("certificate verify failed", "certificate has expired",
                                                "hostname mismatch", "certificate validation failed",
                                                "ssl error: certificate")):
                      category = "TLS_VERIFICATION"
                  elif any(t in detail for t in ("name or service not known",
                                                 "temporary failure in name resolution",
                                                 "could not translate host name",
                                                 "connection timed out",
                                                 "network is unreachable",
                                                 "connection refused")):
                      category = "DNS_NETWORK"
                  else:
                      category = "CONNECTION_UNCLASSIFIED"
              raise SystemExit("N1-E3 FAIL: " + category) from None
          except Exception:
              category = "SQL_UNCLASSIFIED" if phase == "query" else "CONNECTION_UNCLASSIFIED"
              raise SystemExit("N1-E3 FAIL: " + category) from None
          print("N1-E3 PASS: client TLS verified, database and role confirmed; backend TLS independently observed")
          PY
