name: OES Django synthetic preparer - SELECT-only verification
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OES_Q0_MULTI_ALIAS_ENABLED: "1"
      OES_PG_A4_ENABLED: "1"
      OES_PG_A4_HOST: ep-wispy-dream-b6021bw0.c-2.sa-east-1.aws.neon.tech
      OES_PG_A4_PASSWORD: ${{ secrets.OES_PG_A4_READER_PASSWORD }}
      OES_Q0_AUTH_PASSWORD: ${{ secrets.OES_Q0_AUTH_PASSWORD }}
      OES_Q0_WRITER_PASSWORD: ${{ secrets.OES_Q0_WRITER_PASSWORD }}
    steps:
      - name: Require existing distinct credentials
        shell: bash
        run: |
          if [ -z "$OES_PG_A4_PASSWORD" ] || [ -z "$OES_Q0_AUTH_PASSWORD" ] || [ -z "$OES_Q0_WRITER_PASSWORD" ]; then
            echo "::error::HOLD: existing credentials unavailable"
            exit 1
          fi
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing requirements
        working-directory: applications/oes_web
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify synthetic preparer with SELECT only
        working-directory: applications/oes_web
        shell: bash
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connections

          db = connections["default"]
          required = (
              "auth_user", "auth_permission", "django_content_type", "auth_user_user_permissions",
              "auth_user_groups", "auth_group_permissions",
              "preparer_identity_prepareridentity",
          )
          try:
              db.close()
              with db.cursor() as cursor:
                  cursor.execute(
                      "SELECT current_user, session_user, current_database()"
                  )
                  if cursor.fetchone() != (
                      "oes_auth_trial_login", "oes_auth_trial_login", "oes_sandbox"
                  ):
                      raise RuntimeError("HOLD: wrong auth connection")
                  for name in required:
                      qualified = f'django_auth.{name}'
                      cursor.execute(
                          "SELECT to_regclass(%s) IS NOT NULL, "
                          "has_table_privilege(current_user, %s, 'SELECT')",
                          (qualified, qualified)
                      )
                      if cursor.fetchone() != (True, True):
                          raise RuntimeError("HOLD: auth identity schema or SELECT unavailable")
                  cursor.execute("""
                      SELECT COUNT(*)
                      FROM django_auth.auth_user AS u
                      JOIN django_auth.preparer_identity_prepareridentity AS i
                        ON i.user_id = u.id
                      WHERE u.is_active IS TRUE
                        AND u.is_staff IS FALSE
                        AND u.is_superuser IS FALSE
                        AND i.actor_uuid IS NOT NULL
                        AND (
                            EXISTS (
                                SELECT 1
                                FROM django_auth.auth_user_user_permissions AS up
                                JOIN django_auth.auth_permission AS p ON p.id = up.permission_id
                                WHERE up.user_id = u.id
                                  AND p.codename = 'prepare_question'
                                  AND p.content_type_id IN (
                                      SELECT id FROM django_auth.django_content_type
                                      WHERE app_label = 'evidence'
                                  )
                            )
                            OR EXISTS (
                                SELECT 1
                                FROM django_auth.auth_user_groups AS ug
                                JOIN django_auth.auth_group_permissions AS gp
                                  ON gp.group_id = ug.group_id
                                JOIN django_auth.auth_permission AS p ON p.id = gp.permission_id
                                WHERE ug.user_id = u.id
                                  AND p.codename = 'prepare_question'
                                  AND p.content_type_id IN (
                                      SELECT id FROM django_auth.django_content_type
                                      WHERE app_label = 'evidence'
                                  )
                            )
                        )
                  """)
                  count = cursor.fetchone()[0]
                  if count < 1:
                      # Boolean-only staged diagnostics; no rows, counts, IDs or PII.
                      cursor.execute("""
                          SELECT
                              EXISTS (SELECT 1 FROM django_auth.auth_user),
                              EXISTS (
                                  SELECT 1 FROM django_auth.auth_user
                                  WHERE is_active IS TRUE
                                    AND is_staff IS FALSE
                                    AND is_superuser IS FALSE
                              ),
                              EXISTS (
                                  SELECT 1 FROM django_auth.auth_user AS u
                                  JOIN django_auth.preparer_identity_prepareridentity AS i
                                    ON i.user_id = u.id
                                  WHERE u.is_active IS TRUE
                                    AND u.is_staff IS FALSE
                                    AND u.is_superuser IS FALSE
                                    AND i.actor_uuid IS NOT NULL
                              ),
                              EXISTS (
                                  SELECT 1 FROM django_auth.auth_permission AS p
                                  JOIN django_auth.django_content_type AS ct
                                    ON ct.id = p.content_type_id
                                  WHERE ct.app_label = 'evidence'
                                    AND p.codename = 'prepare_question'
                              )
                      """)
                      has_user, has_active_nonadmin, has_bound_identity, has_permission = cursor.fetchone()
                      for label, value in (
                          ("user_exists", has_user),
                          ("active_nonadmin_exists", has_active_nonadmin),
                          ("active_nonadmin_identity_exists", has_bound_identity),
                          ("permission_definition_exists", has_permission),
                      ):
                          print(f"DIAGNOSTIC: {label}={'YES' if value else 'NO'}")
                      raise RuntimeError("HOLD: no eligible persisted synthetic preparer")
                  # Do not output row counts, names, emails, UUIDs or user IDs.
                  print("PASS: eligible persisted preparer exists; identity and permission paths checked")
          finally:
              db.close()
          PY
