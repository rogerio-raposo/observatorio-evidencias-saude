name: OES Django real browser - manual validation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: applications/oes_web/requirements.txt

      - name: Install Django and Playwright
        working-directory: applications/oes_web
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "playwright>=1.55,<2"

      - name: Install Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium

      - name: Check Django configuration
        working-directory: applications/oes_web
        run: python manage.py check

      - name: Inspect real Django with Chromium
        working-directory: applications/oes_web
        run: python scripts/validate_browser.py

      - name: Preserve screenshots, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oes-django-real-browser-evidence
          path: applications/oes_web/browser-evidence/
          if-no-files-found: warn
          retention-days: 7
