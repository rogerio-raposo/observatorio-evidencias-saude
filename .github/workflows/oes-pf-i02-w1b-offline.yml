name: OES PF-I02 W1B offline transaction protocol
on:
  push:
    paths:
      - 'applications/oes_web/evidence/question_uow_offline.py'
      - 'applications/oes_web/evidence/question_preparation.py'
      - 'applications/oes_web/evidence/pf_i03_q0_offline.py'
      - 'applications/oes_web/evidence/tests/test_pf_i03_composed_offline.py'
      - 'applications/oes_web/config/settings_pf_i03_q0_scientific_dormant.py'
      - 'applications/oes_web/config/pf_i03_q0_session_contract.py'
      - 'applications/oes_web/evidence/q0_access_status.py'
      - 'applications/oes_web/config/settings_auth_sandbox.py'
      - 'applications/oes_web/config/auth_pg_g2_p2b_offline.py'
      - 'applications/oes_web/config/auth_pg_g2_p2b_admin_preflight.py'
      - 'applications/oes_web/preparer_identity/**'
      - 'applications/oes_web/evidence/auth_sqlite_sandbox_checks.py'
      - 'applications/oes_web/evidence/q0_synthetic_preview.py'
      - 'applications/oes_web/evidence/templates/evidence/q0_synthetic_preview.html'
      - 'applications/oes_web/evidence/tests/test_q0_synthetic_preview.py'
      - 'applications/oes_web/evidence/urls.py'
      - 'applications/oes_web/evidence/test_question_orm_q0_dormant.py'
      - 'applications/oes_web/evidence/question_orm_q0_connected_recipe_dormant.py'
      - 'applications/oes_web/scripts/q0_rollback_trial_preflight_offline.py'
      - 'applications/oes_web/evidence/test_question_orm_q0_connected_recipe_dormant.py'
      - 'applications/oes_web/evidence/tests/test_q0_commit_candidate_offline.py'
      - 'applications/oes_web/scripts/run_q0_synthetic_commit_candidate.py'
      - 'applications/oes_web/evidence/tests/test_pf_i02_w1b_uow.py'
      - '.github/workflows/oes-pf-i02-w1b-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r applications/oes_web/requirements.txt
      - working-directory: applications/oes_web
        run: python manage.py check
      - working-directory: applications/oes_web
        run: python manage.py test evidence.tests evidence.test_question_orm_q0_dormant evidence.test_question_orm_q0_connected_recipe_dormant --verbosity 2
      - name: Native Django auth and session sandbox on ephemeral SQLite
        working-directory: applications/oes_web
        run: python manage.py test evidence.auth_sqlite_sandbox_checks --settings=config.settings_auth_sandbox --verbosity 2
