<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1273" viewBox="0 0 900 1273" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Figura 2 — Dimensões independentes N, M e A do OES</title>
<desc id="figDesc">A caracterização de uma investigação e produto de evidências liga-se por linhas simples sem setas a três painéis independentes: N, modalidade e profundidade investigativa N0 a N4; M, regime de manutenção M0 a M3, sendo M3 bloqueado; A, garantia A0 a A3, distinguindo A2 aprovação interna de A3 revisão humana independente. Não há progressão automática nem garantia de que combinações sejam permitidas.</desc>
<rect width="900" height="1273" fill="#FFFFFF"/>
<rect x="38" y="40" width="824" height="118" rx="14" fill="#F4F7F9" stroke="none" stroke-width="1.8"/>
<text x="60" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#415167" text-anchor="start">FIGURA 2  |  OBSERVATÓRIO DE EVIDÊNCIAS EM SAÚDE</text>
<text x="60" y="117" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#182E46" text-anchor="start">Três dimensões distintas da investigação</text>
<text x="60" y="144" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#425269" text-anchor="start">Classificações próprias do OES; não são escalas universais de qualidade</text>
<rect x="134" y="191" width="632" height="100" rx="13" fill="#EAF0F5" stroke="#52657B" stroke-width="1.8"/>
<text x="450" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#243349" text-anchor="middle">INVESTIGAÇÃO E PRODUTO</text>
<text x="450" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#243349" text-anchor="middle">DE EVIDÊNCIAS</text>
<path d="M134 241 H52 V891" stroke="#596B7E" stroke-width="2.3" fill="none"/>
<path d="M52 432 H82" stroke="#596B7E" stroke-width="2.3" fill="none"/>
<path d="M52 662 H82" stroke="#596B7E" stroke-width="2.3" fill="none"/>
<path d="M52 891 H82" stroke="#596B7E" stroke-width="2.3" fill="none"/>
<rect x="82" y="332" width="736" height="198" rx="15" fill="#FFFFFF" stroke="#5B687A" stroke-width="1.8"/>
<rect x="103" y="355" width="78" height="75" rx="12" fill="#EDF2F7" stroke="#5B687A" stroke-width="1.5"/>
<text x="142" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#243349" text-anchor="middle">N</text>
<text x="211" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#243349" text-anchor="start">MODALIDADE / PROFUNDIDADE</text>
<text x="211" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#243349" text-anchor="start">N0–N4</text>
<path d="M110 444 H790" stroke="#C6CED6" stroke-width="1.2"/>
<text x="450" y="473" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#243349" text-anchor="middle">Qual investigação foi planejada e realizada?</text>
<text x="450" y="502" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#243349" text-anchor="middle">Extensão e requisitos metodológicos variam conforme a pergunta.</text>

<rect x="82" y="562" width="736" height="198" rx="15" fill="#FFFFFF" stroke="#5B687A" stroke-width="1.8"/>
<rect x="103" y="585" width="78" height="75" rx="12" fill="#EDF2F7" stroke="#5B687A" stroke-width="1.5"/>
<text x="142" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#243349" text-anchor="middle">M</text>
<text x="211" y="608" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#243349" text-anchor="start">MANUTENÇÃO</text>
<text x="211" y="641" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#243349" text-anchor="start">M0–M3</text>
<path d="M110 674 H790" stroke="#C6CED6" stroke-width="1.2"/>
<text x="450" y="703" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#243349" text-anchor="middle">Qual acompanhamento foi previsto?</text>
<text x="450" y="732" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#243349" text-anchor="middle">M3 permanece bloqueado no estado documentado.</text>

<rect x="82" y="792" width="736" height="198" rx="15" fill="#FFFFFF" stroke="#5B687A" stroke-width="1.8"/>
<rect x="103" y="815" width="78" height="75" rx="12" fill="#EDF2F7" stroke="#5B687A" stroke-width="1.5"/>
<text x="142" y="868" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#243349" text-anchor="middle">A</text>
<text x="211" y="838" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#243349" text-anchor="start">GARANTIA OBTIDA</text>
<text x="211" y="871" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#243349" text-anchor="start">A0–A3</text>
<path d="M110 904 H790" stroke="#C6CED6" stroke-width="1.2"/>
<text x="450" y="933" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#243349" text-anchor="middle">Quais verificações e aprovações foram concluídas?</text>
<text x="450" y="962" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#243349" text-anchor="middle">A2: aprovação interna. A3: revisão especializada independente.</text>
<rect x="60" y="1032" width="780" height="151" rx="13" fill="#F5F7FA" stroke="#8A97A7" stroke-width="1.8"/>
<text x="450" y="1068" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#243349" text-anchor="middle">N, M e A não determinam uns aos outros</text>
<text x="450" y="1100" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#243349" text-anchor="middle">As combinações estão sujeitas aos requisitos de cada produto.</text>
<text x="450" y="1131" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#243349" text-anchor="middle">A certeza GRADE não equivale à garantia A0–A3.</text>
<text x="450" y="1159" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#243349" text-anchor="middle">A representação não certifica maturidade ou operação do OES.</text>
<text x="60" y="1224" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#526176" text-anchor="start">Fonte: Documentos 02, 04, 05 e 40; STATE e CP213 (20/10/2026).</text>
</svg>