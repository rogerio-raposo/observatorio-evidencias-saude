<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1273" viewBox="0 0 900 1273" role="img" aria-labelledby="title description">
<title id="title">Figura 6 — Trajetória e estado documentado das oito fases do OES em 20 de outubro de 2026</title>
<desc id="description">Oito fases em dois segmentos de quatro. Fases 0 e 1 com bases iniciais consolidadas; fase 2 concluída como baseline arquitetural; fase 3 concluída no escopo técnico e taxonômico; fase 4 em desenvolvimento e NOT_READY para operação factual; fases 5 a 7 não iniciadas formalmente. Linhas pontilhadas indicam etapas planejadas, não execução. A figura não representa percentuais, validação científica independente ou prontidão para operação sustentada.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526778"/></marker></defs>
