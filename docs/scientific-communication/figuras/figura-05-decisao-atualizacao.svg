<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200" role="img" aria-labelledby="title description">
<title id="title">Figura 5 — Fluxo de reavaliação e atualização das evidências no OES</title>
<desc id="description">Diagrama conceitual de sinais, triagem, avaliação de lacunas operacionais, materialidade, decisões de manutenção ou atualização, confirmação de mudança científica e verificação de garantia antes de uma nova versão. Setas pontilhadas representam retorno para reavaliação, não automação. Não demonstra vigilância factual contínua nem M3 operacional.</desc>
