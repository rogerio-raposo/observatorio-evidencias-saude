<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1720" viewBox="0 0 1100 1720" role="img" aria-labelledby="title description">
<title id="title">Figura 5 — Fluxo decisório de atualização do OES</title>
<desc id="description">Fluxo conceitual: sinal, triagem, distinção entre lacuna operacional e sinal científico, avaliação de materialidade, decisão de manter, reavaliar ou investigar, confirmação de mudança material e revisão e garantia antes de nova versão. Alertas e sinais não alteram automaticamente conclusões; M3 não operacional.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526779"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#223747}.h{font-size:20px;font-weight:700}.b{font-size:16px}.label{font-size:15px;fill:#344c60}</style>
<rect width="1100" height="1720" fill="white"/>
<text x="550" y="42" text-anchor="middle" font-size="23" font-weight="700">Reavaliação e atualização de evidências</text>
<text x="550" y="72" text-anchor="middle" font-size="16">Modelo proposto — não demonstra vigilância factual contínua</text>
<path d="M550 202 V235" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M550 327 V360" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M430 452 V475 H270 V505" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="290" y="486" class="label">Lacuna</text>
<path d="M670 452 V475 H830 V505" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="835" y="486" class="label">Sinal pertinente</text>
<path d="M270 615 V665 H480 V700" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="286" y="654" class="label">Impacto avaliado</text>
<path d="M830 615 V665 H620 V700" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M550 792 V835" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M550 927 V965 H197 V1010" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="224" y="980" class="label">Manter</text>
<path d="M550 927 V1010" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="560" y="973" class="label">Reavaliar</text>
<path d="M550 927 V965 H903 V1010" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="911" y="980" class="label">Investigar</text>
<path d="M903 1120 V1200" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M903 1310 V1385" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="916" y="1356" class="label">Se confirmada</text>
<path d="M903 1495 V1570" fill="none" stroke="#526779" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="915" y="1538" class="label">Se satisfeitos</text>
<g id="step-1"><rect x="300" y="110" width="500" height="92" rx="12" fill="#eff4f7" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="550" y="147" class="h">Objeto e regime</text>
<text text-anchor="middle" x="550" y="176" class="b">Pergunta, versão-alvo, fontes e manutenção M</text></g>
<g id="step-2"><rect x="300" y="235" width="500" height="92" rx="12" fill="#eff4f7" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="550" y="272" class="h">Sinal documentado</text>
<text text-anchor="middle" x="550" y="301" class="b">Evidência, correção, segurança, demanda ou lacuna</text></g>
<g id="step-3"><rect x="300" y="360" width="500" height="92" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="550" y="397" class="h">Triagem e proveniência</text>
<text text-anchor="middle" x="550" y="426" class="b">Pertinência e natureza da ocorrência</text></g>
<g id="step-4"><rect x="55" y="505" width="430" height="110" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="270" y="542" class="h">Lacuna operacional</text>
<text text-anchor="middle" x="270" y="568" class="b"><tspan x="270">Registrar falha e avaliar impacto</tspan><tspan x="270" dy="22">na atualidade</tspan></text></g>
<g id="step-5"><rect x="615" y="505" width="430" height="110" rx="12" fill="#eff4f7" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="830" y="542" class="h">Sinal científico pertinente</text>
<text text-anchor="middle" x="830" y="568" class="b"><tspan x="830">Vincular pergunta, fonte, data</tspan><tspan x="830" dy="22">e versão-alvo</tspan></text></g>
<g id="step-6"><rect x="300" y="700" width="500" height="92" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="550" y="737" class="h">Avaliação de materialidade</text>
<text text-anchor="middle" x="550" y="766" class="b">Impacto científico, validade e adequação de uso</text></g>
<g id="step-7"><rect x="300" y="835" width="500" height="92" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="550" y="872" class="h">Decisão documentada</text>
<text text-anchor="middle" x="550" y="901" class="b">Responsabilidade, justificativa e objeto afetado</text></g>
<g id="step-8"><rect x="42" y="1010" width="310" height="110" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="197" y="1047" class="h">Manter versão</text>
<text text-anchor="middle" x="197" y="1073" class="b"><tspan x="197">Não atualizar; documentar</tspan><tspan x="197" dy="22">a justificativa</tspan></text></g>
<g id="step-9"><rect x="395" y="1010" width="310" height="110" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="550" y="1047" class="h">Reavaliar uso/atualidade</text>
<text text-anchor="middle" x="550" y="1073" class="b"><tspan x="550">Completar dados; não alterar</tspan><tspan x="550" dy="22">automaticamente</tspan></text></g>
<g id="step-10"><rect x="748" y="1010" width="310" height="110" rx="12" fill="#eff4f7" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="903" y="1047" class="h">Investigar ou atualizar</text>
<text text-anchor="middle" x="903" y="1073" class="b"><tspan x="903">Definir escopo e executar</tspan><tspan x="903" dy="22">trabalho científico</tspan></text></g>
<g id="step-11"><rect x="705" y="1200" width="350" height="110" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="880" y="1237" class="h">Mudança material confirmada?</text>
<text text-anchor="middle" x="880" y="1266" class="b">Caso contrário, manter ou reavaliar</text></g>
<g id="step-12"><rect x="705" y="1385" width="350" height="110" rx="12" fill="#fff" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="880" y="1422" class="h">Revisão e garantia satisfeitas?</text>
<text text-anchor="middle" x="880" y="1451" class="b">Caso contrário, corrigir ou bloquear</text></g>
<g id="step-13"><rect x="705" y="1570" width="350" height="94" rx="12" fill="#eff4f7" stroke="#607588" stroke-width="2"/>
<text text-anchor="middle" x="880" y="1607" class="h">Nova versão aprovada</text>
<text text-anchor="middle" x="880" y="1636" class="b">Preservar histórico e proveniência</text></g>
<text x="550" y="1698" font-size="14" text-anchor="middle">Sinal ≠ mudança científica · Alerta ≠ atualização · Garantia não herdada · M3 bloqueado</text></svg>