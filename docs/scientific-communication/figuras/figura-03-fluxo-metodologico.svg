<rect x="48" y="958" width="342" height="116" rx="12" fill="#EFF5F8" stroke="#53667C" stroke-width="1.7" />
<text x="219" y="990" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#263549" text-anchor="middle">Liberação / publicação</text>
<text x="219" y="1019" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#263549" text-anchor="middle">Somente no escopo autorizado</text>
<text x="219" y="1047" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#263549" text-anchor="middle">e com garantia efetivamente obtida</text>
<rect x="495" y="958" width="342" height="116" rx="12" fill="#FFFFFF" stroke="#53667C" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="666" y="990" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#263549" text-anchor="middle">Corrigir ou manter bloqueado</text>
<text x="666" y="1019" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#263549" text-anchor="middle">Reabrir apenas etapas pertinentes</text>
<text x="666" y="1047" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#263549" text-anchor="middle">e registrar decisões e pendências</text>
<rect x="42" y="1106" width="816" height="105" rx="10" fill="#F4F6F8" stroke="#9BA6B3" stroke-width="1.7" />
<text x="61" y="1134" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#39485C" text-anchor="start">LIMITES DE INTERPRETAÇÃO</text>
<text x="61" y="1159" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#263549" text-anchor="start">Etapas proporcionais ao nível N; sequência de extração e crítica pode variar.</text>
<text x="61" y="1184" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#263549" text-anchor="start">A2 não substitui A3; testes técnicos não equivalem à validação científica.</text>
<text x="45" y="1245" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B596B" text-anchor="start">Fonte: Documentos 03, 04, 10–15 e 40. Representação conceitual, não comprovação operacional.</text>
