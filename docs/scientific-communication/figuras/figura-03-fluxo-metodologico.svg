<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1273" viewBox="0 0 900 1273" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Figura 3 — Fluxo metodológico de produção e revisão de evidências no OES</title>
<desc id="figDesc">Fluxo conceitual vertical: pergunta e protocolo; busca; elegibilidade; extração; avaliação crítica; síntese e interpretação; conclusão e produto proposto; decisão sobre revisão e garantia. Em caso afirmativo, liberação apenas no escopo autorizado. Em caso negativo, correção das etapas pertinentes ou bloqueio. Faixa transversal de transparência e proveniência. Não representa execução obrigatória idêntica nem validação independente alcançada.</desc>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#4E6278"/></marker></defs>
