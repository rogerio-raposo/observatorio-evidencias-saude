<text x="366" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#263549" text-anchor="middle">Busca documentada</text>
<text x="366" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#263549" text-anchor="middle">Cobertura compatível com a pergunta e o método</text>
