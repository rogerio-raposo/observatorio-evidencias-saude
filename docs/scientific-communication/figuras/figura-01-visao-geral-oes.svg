<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1273" viewBox="0 0 900 1273" role="img" aria-labelledby="title desc">
<title id="title">Figura 1 — Organização conceitual proposta do OES</title>
<desc id="desc">Percurso vertical: pergunta científica, investigação proporcional, fontes e objetos rastreáveis, síntese, produto. Controles transversais incidem sobre investigação e produto. Setas pontilhadas indicam atualização opcional; sem mudança material mantém-se a versão, com mudança a nova versão exige análise e aprovação. A figura não representa operação factual ou validação científica independente.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#506277"/></marker></defs>
